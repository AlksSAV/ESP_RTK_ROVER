; ESP_RTK_ROVER - transparent Bluetooth <-> UART bridge for an RTK GNSS receiver.
;
;   GNSS TX --> RX pin --> UART --> Bluetooth --> phone   (NMEA / UBX)
;   GNSS RX <-- TX pin <-- UART <-- Bluetooth <-- phone   (RTCM3 corrections)
;
; Build:
;   pio run -t upload   — XIAO ESP32C6, BLE
;   pio device monitor  — console @ 115200

[platformio]
default_envs = xiao_esp32c6_ble

[env]
; ESP32-C6 needs Arduino core 3.x, which only ships in the pioarduino fork of
; platform-espressif32.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags = -DCORE_DEBUG_LEVEL=0

; --------------------------------------------------------------------------
; Seeed XIAO ESP32-C6 - BLE Nordic UART Service
; --------------------------------------------------------------------------
[env:xiao_esp32c6_ble]
board = seeed_xiao_esp32c6
build_flags =
	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DGNSS_UART_NUM=1
	-DPIN_GNSS_RX=17
	-DPIN_GNSS_TX=16
	-DLED_ACTIVE_LOW=1
lib_deps = h2zero/NimBLE-Arduino@^2.5.1
